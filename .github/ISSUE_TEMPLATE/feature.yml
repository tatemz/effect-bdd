name: Feature request
description: Propose an improvement to effect-bdd
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before proposing an implementation. This helps evaluate simpler alternatives and compatibility costs.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or use case should effect-bdd address?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe the behavior or API you want, including a usage example when useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or different designs have you considered?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add related issues, prior art, compatibility concerns, or other relevant details.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for similar requests.
          required: true

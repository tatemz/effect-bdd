name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable && corepack prepare pnpm@10.16.1 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - name: Inspect package archives
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-packages"
          pnpm --filter effect-bdd pack --pack-destination "$GITHUB_WORKSPACE/release-packages"
          pnpm --filter @effect-bdd/hello pack --pack-destination "$GITHUB_WORKSPACE/release-packages"
      - name: Verify npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish packages to npm
        run: pnpm run publish:packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub releases
        run: |
          effect_bdd_version="$(node -p "require('./packages/effect-bdd/package.json').version")"
          hello_version="$(node -p "require('./packages/hello/package.json').version")"
          gh release create "effect-bdd-v${effect_bdd_version}" --target "$GITHUB_SHA" --title "effect-bdd v${effect_bdd_version}" --generate-notes
          gh release create "hello-v${hello_version}" --target "$GITHUB_SHA" --title "@effect-bdd/hello v${hello_version}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
